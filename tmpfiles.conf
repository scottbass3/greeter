# Wallpaper, colors and avatar synced by each user's shell, one directory per
# user. Sticky like /tmp: users can only remove their own entries, and the
# greeter only reads a directory owned by the user it is named after.
d /var/lib/scottbass3-greeter 0755 root root -
d /var/lib/scottbass3-greeter/users 1777 root root -
